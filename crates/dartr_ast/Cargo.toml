[package]
name = "dartr_ast"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The JSON -> AST loader and the round trip tool (tests without a parser).
testing = ["dep:serde", "dep:serde_json", "dep:rayon"]

[dependencies]
dartr_syntax.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["raw_value", "unbounded_depth"] }
rayon = { workspace = true, optional = true }

[[bin]]
name = "ast_roundtrip"
required-features = ["testing"]
