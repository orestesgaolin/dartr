version: 1
transforms:
  - title: 'Rename to Other'
    date: 2024-01-01
    element:
      uris: ['src/other.dart']
      class: 'OldOther'
    changes:
      - kind: 'rename'
        newName: 'Other'
  - title: 'Rename to run'
    date: 2024-01-01
    element:
      uris: ['src/other.dart']
      method: 'oldRun'
      inClass: 'Base'
    changes:
      - kind: 'rename'
        newName: 'run'
  - title: 'Rename to helperFunction'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      function: 'oldHelper'
    changes:
      - kind: 'rename'
        newName: 'helperFunction'
  - title: 'Replace with compute2'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      function: 'compute'
    changes:
      - kind: 'replacedBy'
        newElement:
          uris: ['src/helpers.dart']
          function: 'compute2'
  - title: 'Remove scale'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      function: 'compute'
    changes:
      - kind: 'removeParameter'
        name: 'scale'
  - title: 'Add type argument'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      function: 'compute'
    changes:
      - kind: 'addTypeParameter'
        index: 0
        name: 'T'
        argumentValue:
          expression: 'int'
  - title: 'Rename height'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      method: 'resize'
      inClass: 'Box'
    changes:
      - kind: 'renameParameter'
        oldName: 'height'
        newName: 'h'
  - title: 'Add depth'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      method: 'resize'
      inClass: 'Box'
    changes:
      - kind: 'addParameter'
        index: 1
        name: 'depth'
        style: required_positional
        argumentValue:
          expression: '{% w %} * 2'
          variables:
            w:
              kind: 'fragment'
              value: 'arguments[0]'
  - title: 'Use size'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      getter: 'length'
      inClass: 'Box'
    changes:
      - kind: 'replacedBy'
        newElement:
          uris: ['src/helpers.dart']
          method: 'size'
          inClass: 'Box'
  - title: 'Use default Box'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      constructor: 'old'
      inClass: 'Box'
    changes:
      - kind: 'replacedBy'
        newElement:
          uris: ['src/helpers.dart']
          constructor: ''
          inClass: 'Box'
  - title: 'Migrate paint'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      function: 'paint'
    variables:
      color:
        kind: 'fragment'
        value: 'arguments[color]'
      fill:
        kind: 'fragment'
        value: 'arguments[fill]'
    oneOf:
      - if: "color != '' && fill == 'true'"
        changes:
          - kind: 'rename'
            newName: 'paintFilled'
          - kind: 'removeParameter'
            name: 'fill'
      - if: "color != ''"
        changes:
          - kind: 'rename'
            newName: 'paintColored'
  - title: 'Add mode when enabled'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      function: 'configure'
    changes:
      - kind: 'addParameter'
        index: 1
        name: 'mode'
        style: optional_named
        argumentValue:
          expression: "'fast'"
          requiredIf: "enabled == 'true'"
          variables:
            enabled:
              kind: 'fragment'
              value: 'arguments[enabled]'
  - title: 'Make label non-null'
    date: 2024-01-01
    element:
      uris: ['src/helpers.dart']
      function: 'setLabel'
    changes:
      - kind: 'changeParameterType'
        index: 0
        nullability: non_null
        argumentValue:
          expression: "'default'"

